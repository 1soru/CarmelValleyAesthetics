<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carmel Valley Aesthetics Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111111;
    --card2: #161616;
    --line: #262626;
    --text: #f4f4f4;
    --muted: #8b8b8b;
    --gold: #c9a35c;
    --gold-soft: rgba(201, 163, 92, 0.14);
    --up: #4ade80;
    --up-bg: rgba(74, 222, 128, 0.12);
    --down: #f87171;
    --down-bg: rgba(248, 113, 113, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  /* ---------- Nav ---------- */
  nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(10, 10, 10, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 960px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--gold-soft); border: 1px solid var(--gold);
    color: var(--gold); font-weight: 900; font-size: 0.75rem;
    display: grid; place-items: center;
  }
  .brand-name { font-weight: 800; font-size: 0.82rem; letter-spacing: 0.02em; }
  .brand-sub { color: var(--gold); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.14em; margin-top: 2px; }
  .links { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .links::-webkit-scrollbar { display: none; }
  .links a {
    color: var(--muted); font-size: 0.8rem; font-weight: 600;
    padding: 7px 12px; border-radius: 8px; white-space: nowrap;
  }
  .links a:hover { color: var(--text); }
  .links a.active { background: var(--card2); color: var(--text); border: 1px solid var(--line); }

  .signout {
    margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--line); color: var(--muted);
    font: inherit; font-size: 0.75rem; font-weight: 600;
    padding: 7px 11px; border-radius: 8px; cursor: pointer;
  }
  .signout:hover { color: var(--text); border-color: #3a3a3a; }
  .signout svg { width: 13px; height: 13px; }

  main { max-width: 600px; margin: 0 auto; padding: 0 16px 80px; }

  /* ---------- Hero ---------- */
  .hero { text-align: center; padding: 44px 0 28px; }
  .eyebrow {
    color: var(--gold); font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .hero h1 {
    font-size: clamp(2rem, 7vw, 2.9rem); font-weight: 900;
    letter-spacing: -0.03em; line-height: 1.05; margin: 10px 0 12px;
  }
  .hero p { color: var(--muted); font-size: 0.88rem; line-height: 1.55; max-width: 460px; margin: 0 auto; }
  .pills { display: flex; justify-content: center; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 12px; font-size: 0.7rem; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill svg { width: 12px; height: 12px; }

  /* ---------- Cards ---------- */
  .box {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; margin-bottom: 18px;
  }
  .label {
    display: flex; align-items: center; gap: 7px;
    color: var(--gold); font-size: 0.66rem; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .label svg { width: 13px; height: 13px; }

  /* Breaking news */
  .breaking { padding: 18px; }
  .breaking h2 { font-size: 1.15rem; font-weight: 800; margin: 10px 0 10px; }
  .breaking p { font-size: 0.86rem; line-height: 1.6; color: #d8d8d8; }
  .news-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
  .news-imgs img { width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 4px; display: block; }
  .news-imgs.one { grid-template-columns: 1fr; }

  /* Ticker */
  .ticker { padding: 12px 0; overflow: hidden; }
  .ticker .label { padding: 0 12px 8px; }
  .track { display: flex; width: max-content; animation: scroll 40s linear infinite; }
  .ticker:hover .track { animation-play-state: paused; }
  .tick { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; padding: 0 16px; white-space: nowrap; }
  .tick .r { color: var(--muted); font-weight: 500; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---------- Podium ---------- */
  .section-head { text-align: center; margin: 34px 0 24px; }
  .section-head h2 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; margin: 8px 0 8px; }
  .section-head p { color: var(--muted); font-size: 0.8rem; line-height: 1.5; }
  .section-head .rule { width: 60px; height: 1px; background: var(--line); margin: 16px auto 0; }
  .section-head .label { justify-content: center; }

  .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-items: end; margin-bottom: 18px; }
  .pod {
    background: var(--card); border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 3px; display: flex; flex-direction: column;
  }
  .pod.first { border-color: var(--gold); transform: translateY(-26px); box-shadow: 0 0 0 1px rgba(201,163,92,0.25), 0 12px 40px rgba(201,163,92,0.08); }
  .pod.third { border-color: #7a5c35; }
  .pod-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 9px 10px; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
  }
  .pod.first .pod-head { color: var(--gold); }
  .pod.third .pod-head { color: #b88a52; }
  .pod-head .label { font-size: 0.62rem; }
  .pod-photo {
    position: relative; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden;
    background: #0c0c0c; border: 1px solid var(--line);
  }
  .pod-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pod-photo .init {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 2.4rem; font-weight: 900; color: #2c2c2c;
  }
  .pod-name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
  }
  .pod-name small { display: block; font-size: 0.6rem; font-weight: 800; color: var(--gold); }
  .pod-name b { font-size: 0.92rem; font-weight: 800; }

  /* Badges */
  .badge {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 0.66rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;
    white-space: nowrap;
  }
  .badge.up { color: var(--up); background: var(--up-bg); }
  .badge.down { color: var(--down); background: var(--down-bg); }
  .badge.same { color: var(--muted); background: var(--card2); }
  .badge.new { color: var(--gold); background: var(--gold-soft); }
  .txt-up { color: var(--up); }
  .txt-down { color: var(--down); }

  /* ---------- Countdown ---------- */
  .countdown { padding: 16px; text-align: center; }
  .countdown .label { justify-content: center; margin-bottom: 12px; }
  .clock { display: flex; justify-content: center; align-items: flex-start; gap: 8px; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .unit span {
    background: #0c0c0c; border: 1px solid var(--line); border-radius: 6px;
    min-width: 44px; padding: 9px 6px; font-size: 1.05rem; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .unit small { font-size: 0.55rem; color: var(--muted); letter-spacing: 0.1em; }
  .colon { color: var(--muted); padding-top: 10px; }

  /* ---------- Risers / Drops ---------- */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .split .box { margin-bottom: 0; }
  .split-head {
    display: flex; align-items: center; gap: 7px;
    padding: 13px 14px; border-bottom: 1px solid var(--line);
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .split-head svg { width: 14px; height: 14px; }
  .mini { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 0.82rem; font-weight: 700; }
  .mini .r { color: var(--muted); font-weight: 500; width: 18px; font-size: 0.75rem; }
  .mini .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 0.8rem; padding: 14px; }

  .av {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: #1d1d1d; border: 1px solid var(--line); color: var(--muted);
    font-size: 0.62rem; font-weight: 800; display: grid; place-items: center;
    object-fit: cover; overflow: hidden;
  }
  .av.lg { width: 38px; height: 38px; font-size: 0.75rem; }

  /* ---------- Full ranking ---------- */
  .full-label { margin: 30px 0 12px; }
  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .row .r { width: 24px; text-align: center; font-weight: 800; color: var(--muted); font-size: 0.85rem; }
  .row.top .r { color: var(--gold); }
  .row .info { flex: 1; min-width: 0; }
  .row .name { font-weight: 700; font-size: 0.9rem; }
  .row .note { color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .row .score { font-weight: 800; font-size: 0.95rem; text-align: right; }
  .tier {
    display: inline-block; font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em;
    padding: 2px 7px; border-radius: 4px; margin-top: 3px; border: 1px solid;
  }
  .row .mv { width: 44px; text-align: right; flex-shrink: 0; }

  /* ---------- News list ---------- */
  .news-item { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .news-item:last-child { border-bottom: 0; }
  .news-item .d { color: var(--muted); font-size: 0.7rem; font-weight: 600; }
  .news-item h3 { font-size: 0.95rem; font-weight: 800; margin: 4px 0 6px; }
  .news-item p { color: #cfcfcf; font-size: 0.82rem; line-height: 1.55; }

  footer { text-align: center; color: var(--muted); font-size: 0.72rem; padding: 30px 0 0; }

  /* ---------- Phone ---------- */
  @media (max-width: 600px) {
    .podium { gap: 7px; }
    .pod.first { transform: translateY(-16px); }
    .pod-head { padding: 7px 6px 8px; font-size: 0.52rem; letter-spacing: 0.06em; }
    .pod-head .badge { font-size: 0.55rem; padding: 1px 4px; }
    .pod-name b { font-size: 0.78rem; }
    .split { grid-template-columns: 1fr; }
    .brand-text { display: none; }
    .nav-inner { gap: 12px; }
  }

  /* ---------- Lock screen ---------- */
  body.locked nav, body.locked main { display: none; }
  .lock {
    position: fixed; inset: 0; z-index: 50; background: var(--bg);
    display: grid; place-items: center; padding: 16px;
    opacity: 0; transition: opacity .2s;
  }
  .lock.ready { opacity: 1; }
  .lock-card { width: 100%; max-width: 340px; text-align: center; }
  .lock-mark {
    width: 52px; height: 52px; margin: 0 auto 18px; border-radius: 12px;
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--gold);
    display: grid; place-items: center;
  }
  .lock-mark svg { width: 22px; height: 22px; }
  .lock h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.15; margin: 8px 0 6px; }
  .lock p { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; }
  .lock input {
    width: 100%; background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 12px 14px; border-radius: 8px; font: inherit; font-size: 0.95rem; outline: none;
  }
  .lock input:focus { border-color: var(--gold); }
  .lock button {
    width: 100%; margin-top: 10px; background: var(--gold); color: #111; border: 0;
    border-radius: 8px; padding: 12px; font: inherit; font-weight: 800; cursor: pointer;
  }
  .lock button:disabled { opacity: 0.6; cursor: default; }
  .lock-err { color: var(--down); font-size: 0.78rem; min-height: 1.2em; margin-top: 10px; }
</style>
</head>

  <div class="label full-label" id="news">All News</div>
  <div class="box" id="newsList"></div>

  <footer id="footer"></footer>

   ============================================================ */

const $ = id => document.getElementById(id);
const STORE_KEY = "cvar-pass";

$("lockOrg").textContent = SITE.org;
$("lockTitle").textContent = SITE.title;
document.title = SITE.title;

async function decrypt(pw) {
  const raw = Uint8Array.from(atob(ENC), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function tryUnlock(pw, remember) {
  try {
    const data = await decrypt(pw);
    if (remember) { try { localStorage.setItem(STORE_KEY, pw); } catch (e) {} }
    $("lock").remove();
    document.body.classList.remove("locked");
    render(data);
    return true;
  } catch (e) {
    return false;
  }
}

$("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("lockBtn");
  btn.disabled = true; btn.textContent = "Checking...";
  $("lockErr").textContent = "";
  const ok = await tryUnlock($("lockInput").value, true);
  if (!ok) {
    btn.disabled = false; btn.textContent = "Enter";
    $("lockErr").textContent = "Wrong password";
    $("lockInput").select();
  }
});

// Sign out: forget the saved password on this browser and lock the page again
$("signOut").addEventListener("click", () => {
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  location.reload();
});

// Skip the lock screen if this browser already entered the right password
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
  if (saved && !(await tryUnlock(saved, false))) {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  if ($("lock")) $("lock").classList.add("ready");
})();

/* ============================================================
   Rendering
   ============================================================ */

const TIERS = {
  "CHAD":     { min: 8, c: "#c9a35c" },
  "CHADLITE": { min: 7, c: "#8fb3ff" },
  "HTN":      { min: 6, c: "#4ade80" },
  "MTN":      { min: 5, c: "#a3a3a3" },
  "LTN":      { min: 0, c: "#f87171" }
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const initials = n => n.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

function tierFor(p) {
  const t = (p.tier || "").toUpperCase();
  if (TIERS[t]) return t;
  return Object.keys(TIERS).find(k => p.score >= TIERS[k].min);
}

function avatar(p, cls = "av") {
  return p.photo
    ? `<img class="${cls}" src="${esc(p.photo)}" alt="">`
    : `<div class="${cls}">${esc(initials(p.name))}</div>`;
}

function badge(p) {
  if (p.diff === null) return `<span class="badge new">NEW</span>`;
  if (p.diff > 0) return `<span class="badge up">↑ +${p.diff}</span>`;
  if (p.diff < 0) return `<span class="badge down">↓ ${p.diff}</span>`;
  return `<span class="badge same">–</span>`;
}

function render(DATA) {
  const PEOPLE = DATA.people || [];
  const NEWS = DATA.news || [];

  const ranked = [...PEOPLE]
    .sort((a, b) => b.score - a.score)
    .map((p, i) => ({ ...p, rank: i + 1, diff: p.last == null ? null : p.last - (i + 1) }));

  // Header text
  $("brandName").textContent = SITE.brandName;
  $("brandSub").textContent = SITE.brandSub;
  $("org").textContent = SITE.org;
  $("title").textContent = SITE.title;
  $("subtitle").textContent = SITE.subtitle;
  $("verified").textContent = SITE.verified;
  $("count").textContent = `${ranked.length} ranked figures`;
  $("footer").textContent = `© ${new Date().getFullYear()} ${SITE.org}`;

  // Breaking news
  const newsIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>`;
  if (NEWS.length) {
    const b = NEWS[0];
    const imgs = (b.images || []).slice(0, 2);
    $("breaking").innerHTML = `
      <div class="label">${newsIcon} Breaking News</div>
      <h2>${esc(b.headline)}</h2>
      <p>${esc(b.body)}</p>
      ${imgs.length ? `<div class="news-imgs ${imgs.length === 1 ? "one" : ""}">${imgs.map(s => `<img src="${esc(s)}" alt="">`).join("")}</div>` : ""}`;
  } else {
    $("breaking").style.display = "none";
  }

  // Movement ticker
  const movers = ranked.filter(p => p.diff);
  if (movers.length) {
    const items = movers.map(p => `
      <span class="tick"><span class="r">#${p.rank}</span>${esc(p.name)}
      <span class="${p.diff > 0 ? "txt-up" : "txt-down"}">${p.diff > 0 ? "+" : ""}${p.diff}</span></span>`).join("");
    const reps = Math.max(1, Math.ceil(12 / movers.length));
    const half = items.repeat(reps);
    $("ticker").innerHTML = half + half;
  } else {
    $("tickerBox").style.display = "none";
  }

  // Podium
  const crown = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l4 4 5-7 5 7 4-4-2 12H5L3 7z"/></svg>`;
  const slots = [
    { idx: 1, cls: "second", label: "Runner Up" },
    { idx: 0, cls: "first",  label: `<span class="label">${crown} Number One</span>` },
    { idx: 2, cls: "third",  label: "Third" }
  ];
  $("podium").innerHTML = slots.map(s => {
    const p = ranked[s.idx];
    if (!p) return "<div></div>";
    return `
      <div class="pod ${s.cls}">
        <div class="pod-head"><span>${s.label}</span>${badge(p)}</div>
        <div class="pod-photo">
          ${p.photo ? `<img src="${esc(p.photo)}" alt="">` : `<div class="init">${esc(initials(p.name))}</div>`}
          <div class="pod-name"><small>#${p.rank}</small><b>${esc(p.name)}</b></div>
        </div>
      </div>`;
  }).join("");

  // Risers and drops
  function miniList(list, el) {
    $(el).innerHTML = list.length
      ? list.map(p => `
          <div class="mini">
            <span class="r">${p.rank}</span>${avatar(p)}
            <span class="n">${esc(p.name)}</span>${badge(p)}
          </div>`).join("")
      : `<div class="empty">Nobody this week</div>`;
  }
  miniList(ranked.filter(p => p.diff > 0).sort((a, b) => b.diff - a.diff).slice(0, 3), "risers");
  miniList(ranked.filter(p => p.diff < 0).sort((a, b) => a.diff - b.diff).slice(0, 3), "drops");

  // Full ranking
  $("fullList").innerHTML = ranked.map(p => {
    const t = tierFor(p);
    return `
      <div class="row ${p.rank <= 3 ? "top" : ""}">
        <span class="r">${p.rank}</span>
        ${avatar(p, "av lg")}
        <div class="info">
          <div class="name">${esc(p.name)}</div>
          ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
        </div>
        <div class="score">
          ${Number(p.score).toFixed(1)}<br>
          <span class="tier" style="color:${TIERS[t].c};border-color:${TIERS[t].c}55">${t}</span>
        </div>
        <div class="mv">${badge(p)}</div>
      </div>`;
  }).join("");

  // All news
  $("newsList").innerHTML = NEWS.map(n => `
    <div class="news-item">
      <div class="d">${esc(n.date)}</div>
      <h3>${esc(n.headline)}</h3>
      <p>${esc(n.body)}</p>
    </div>`).join("") || `<div class="empty">No news yet</div>`;

  // Countdown to next weekly update
  function nextUpdate() {
    const now = new Date();
    const t = new Date(now);
    t.setHours(SITE.updateHour, 0, 0, 0);
    t.setDate(now.getDate() + (SITE.updateDay - now.getDay() + 7) % 7);
    if (t <= now) t.setDate(t.getDate() + 7);
    return t;
  }
  const pad = n => String(n).padStart(2, "0");
  function tickClock() {
    let s = Math.max(0, Math.floor((nextUpdate() - new Date()) / 1000));
    $("cd-d").textContent = Math.floor(s / 86400); s %= 86400;
    $("cd-h").textContent = pad(Math.floor(s / 3600)); s %= 3600;
    $("cd-m").textContent = pad(Math.floor(s / 60));
    $("cd-s").textContent = pad(s % 60);
  }
  tickClock();
  setInterval(tickClock, 1000);
}
</script>
</body>
</html>
